# Confirmed facts from cluster output, unknowns preserved as null.
# spec_version 3 (2026-10-26): SM_UKO actualization. Cluster facts below stay.
# Spark sizing for NT is archive-query profile common. The previous 10×4×16g
# sizing is layout_probe only and is not comparable with prod timings.
environment:
  id: sdp_3_5_4_1_1
  spec_version: 3
  time_zone: UTC
  security:
    enabled: true
    mechanism: kerberos
    runner_principal: pvm-omltp-sdp@OPSMON.SBT
    keytab_path: ~/keytab/pvm-omltp-sdp.keytab
    kinit_verified: true
    realm: OPSMON.SBT
    hive_jdbc_auth: kerberos
    ticket_renewable_days: 7
  versions:
    java: 1.8.0_292
    hadoop: 3.1.3.3.5.4.1-1
    orc_writer: null
    spark: 3.2.1.3.5.4.1-1
    hive: 3.1.2.3.5.4.1-1
    tez: 0.9.1.3.5.4.1-1
    llap: null
    scala: 2.12.15
    orc_spark: 1.6.12
    orc_hive: 1.5.6
    orc_generator: 1.6.12
  hdfs:
    namenode_uri: hdfs://sdp-dzo-lt-omlt
    default_replication: 2
    # Test-cluster fact. The production index uses 256 MiB blocks and replication 3.
    # permission_to_change_cluster_config is false, so the benchmark keeps 128 / 2.
    block_size_mib: 128
    free_space_gib: 18067
    # Budget for this test from the SM_UKO analysis (§4.1, §4.3), not cluster free space.
    test_data_budget_with_replicas_tib: 3
    test_data_usable_note: about 2 TiB unique at replication 2; one old-era 5-day layout is ~2.3 TiB with replicas
    short_circuit_read:
      supported: true
      enabled: true
      mutable_by_runner: false
    centralized_cache:
      supported: null
      mutable_by_runner: false
    data_locality_verifiable: true
    work_dir: /orc_test
    write_verified: true
  yarn:
    resource_manager: omlt-abyss-sdp-namenode-02.opsmon.sbt:8088
    resource_manager_standby: omlt-abyss-sdp-namenode-01.opsmon.sbt
    queue: default
    # Effective_Max_Capacity of queue default (60% capacity, 80% max): 221184 MB ≈ 216 GiB, vCores 67.
    # Analysis §4.1 reports the whole YARN pool: 84 vCores / 270 GB, of which ~81 / 241 GB were free.
    # 270 GB × 0.8 = 216 and 84 × 0.8 ≈ 67, so the two snapshots are the pool and this queue, not a conflict.
    available_memory_gib: 216
    available_vcores: 67
    pool_vcores: 84
    pool_memory_gb: 270
  spark:
    master: yarn
    # Submit is cluster-only. Scripts reject deploy_mode=client.
    deploy_mode: cluster
    # Active NT profile: archive-query `common` (analysis §4.2). Complexity multiplier
    # ×2/×3 was not applied on prod (complexity field empty) and stays off here.
    # Idle test cluster fits about 9 such apps on cores (81/9) and about 12 on memory.
    profile: prod_common
    executor_instances: 4
    executor_cores: 2
    executor_memory_gib: 3
    executor_memory_overhead_mib: 512
    driver_cores: 1
    driver_memory_gib: 2
    memory_fraction: 0.8
    shuffle_partitions: 200
    default_parallelism: 4
    # Prod writer cap. Observed index files are ~3.2e6 rows, so generation follows
    # benchmark.target_file_size_mib, not this cap.
    files_max_records_per_file: 1000000
    max_app_attempts: 1
    event_log_enabled: true
    complexity_multiplier: not_applied
    enable_hive_support: true
    layout_probe:
      note: previous first-trial sizing (10×4×16g). Single-job layout microbenchmark only; timings are not comparable to archive-query.
      executor_instances: 10
      executor_cores: 4
      executor_memory_gib: 16
    # Named profile referenced by benchmark.engine_profiles.SPARK_COMMON.sizing_profile.
    # Numbers match the flat executor_* / driver_* fields above, which spark-submit reads.
    prod_common:
      executor_instances: 4
      executor_cores: 2
      executor_memory_gib: 3
      executor_memory_overhead_mib: 512
      driver_cores: 1
      driver_memory_gib: 2
  hive:
    jdbc_url: jdbc:hive2://omlt-abyss-sdp-namenode-01.opsmon.sbt:2181,omlt-abyss-sdp-namenode-02.opsmon.sbt:2181,omlt-abyss-sdp-srv-01.opsmon.sbt:2181/;serviceDiscoveryMode=zooKeeper;zooKeeperNamespace=hiveserver2
    metastore_uri: thrift://omlt-abyss-sdp-datanode-03.opsmon.sbt:9083
    tez_available: true
    llap_available: true
    llap_daemons: omlt-abyss-sdp-datanode-03.opsmon.sbt
    llap_cache_gib: null
    materialized_views_supported: false
    bucket_version: 'supported (probe 2026-10-16: CLUSTERED BY (k) INTO 4 BUCKETS, Num Buckets: 4)'
    llap_app_name: llap0
    llap_execution_mode: only
    execution_mode_reported: llap
    orc_split_strategy: HYBRID
    llap_daemons_running_verified: null
    ddl_execution_verified: true
    jdbc_connection_verified: true
    llap_configured: true
    observed_properties:
      hive.execution.mode: llap
      hive.llap.execution.mode: only
      hive.exec.orc.split.strategy: HYBRID
    connection:
      type: beeline
      auth: kerberos
      principal: pvm-omltp-sdp@OPSMON.SBT
      service_discovery: zooKeeper
      zooKeeperNamespace: hiveserver2
      jdbc_url: jdbc:hive2://omlt-abyss-sdp-namenode-01.opsmon.sbt:2181,omlt-abyss-sdp-namenode-02.opsmon.sbt:2181,omlt-abyss-sdp-srv-01.opsmon.sbt:2181/;serviceDiscoveryMode=zooKeeper;zooKeeperNamespace=hiveserver2
      verified: true
    hs2_instances: null
    hs2_max_sessions: null
  operations:
    permission_to_reset_caches: false
    permission_to_change_cluster_config: false
    metrics_export_available: null
    allow_production_cluster_changes: false
  preflight:
    require_exact_versions: true
    require_hdfs_capacity_check: true
    require_feature_probe: true
    fail_if_required_capability_missing: false
    mark_unavailable_experiments_as_skipped: true
    require_tez_version_probe: false
    require_java8_runtime_check: true
  versions_note: |-
    Tez 0.9.1.3.5.4.1-1 confirmed by tez-api pom.properties; Hive JDBC connection verified; LLAP is
    configured as only with app name llap0, probe 2026-10-16 (query with hive.llap.execution.mode=only) failed -
    daemons do not run (llap_available/llap_daemons_running_verified: false). ORC runtime JAR versions known from
    host: Spark distribution 1.6.12 (/usr/sdp/3.5.4.1-1/spark3/jars/orc-core-1.6.12.jar, orc-mapreduce-1.6.12.jar),
    Hive 1.5.6 (/usr/sdp/3.5.4.1-1/hive/lib/orc-core-1.5.6.jar); orc_generator is the Spark runtime writer the
    runner uses for materialization; orc_writer (original sample) stays unknown (footer orc_format_version 0.12 is
