    hdfs://sdp-dzo-lt-omlt (HA nameservice; NN omlt-abyss-sdp-namenode-01/02.opsmon.sbt, RPC-SSL 50470); HDFS
    45.3 TiB total / 19.1 TiB used / 17.5 TiB free (snapshot), replication 2, block 128 MiB, 6 datanodes
