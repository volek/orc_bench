# Project-specific synthetic data generator specification, not ORC native config.
dataset:
  id: audit_events
  spec_version: 1
  canonical_schema_file: schema.orc.txt
  type_validation_status: verified_from_sample_orc_footer
  prohibited_data: real_personal_data
  canonical_representation: RAW_ARRAY
  preserve_original_physical_schema: true
  baseline_is_original_orc_schema: true
  source_sample_metadata:
    rows: 799160
    compression: SNAPPY
    row_index_stride: 10000
    orc_format_version: '0.12'
    metadata_not_runtime_library_version: true
  derived_representations:
  - PAIRS
  - MAP
  - FLAT
  - HYBRID
  original_arrays_immutable: true
scales:
  S:
    target_logical_gib: 100
  M:
    target_logical_gib: 1024
  L:
    target_logical_gib: 5120
generation:
  seed: 123456789
  algorithm_version: audit_synth_v1
  deterministic_by:
  - seed
  - row_id
  - column_name
  - algorithm_version
  batch_rows: 1024
  base_time_zone: UTC
  timestamp_range:
    from: '2026-01-01T00:00:00Z'
    to_exclusive: '2026-02-01T00:00:00Z'
  source_materialization: once_per_scale
  row_count: null
  strict_cardinality: true
  null_profile: baseline_no_nulls
  parallel_array_alignment: positionally_matched
  timezone_assumption_requires_validation: true
columns:
  userLogin:
    generator: prefixed_id
    prefix: userLogin
    cardinality: 1000000
  createdAt:
    generator: timestamp_uniform
  session:
    generator: session_id
    prefix: copy2_
    cardinality: 5000000
  userNode:
    generator: dictionary
    prefix: userNode
    cardinality: 1000
  module:
    generator: dictionary
    prefix: module_
    cardinality: 500
  name:
    generator: weighted_dictionary
    values:
    - LOGON
    - LOGOFF
    - ACTION
    weights:
    - 0.6
    - 0.25
    - 0.15
  userName:
    generator: correlated_prefixed_id
    correlated_with: userLogin
    prefix: userName
  metamodelVersion:
    generator: dictionary
    prefix: metamodelVersion
    cardinality: 1000
  tags:
    generator: empty_array
    element_type: string
  paramOldValue:
    generator: null_array
    element_type: string
    note: sample CSV empty; null/empty semantics require row-level validation
  archiveInternalId:
    generator: uuid_deterministic
  archiveInsertTime:
    generator: derived_timestamp
    source: createdAt
    offset_seconds:
    - 0
    - 120
  __time:
    generator: copy_timestamp
    source: createdAt
parameters:
  internal_representation: ordered_name_value_pairs
  order_profiles:
  - fixed
  - shuffled
  default_order_profile: fixed
  duplicate_names: forbidden_in_baseline
  missing_keys_profile: none_in_baseline
  catalog:
    OPERATION_UID:
      generator: uuid_deterministic
      cardinality: high
    TYPE:
      generator: copy_column
      column: name
    SESSION_ID:
      generator: copy_column
      column: session
    VSP_CODE:
      generator: dictionary
      cardinality: 1000
      prefix: vsp_code_
    OSB_CODE:
      generator: dictionary
      cardinality: 500
      prefix: osb_code_
    TB_CODE:
      generator: dictionary
      cardinality: 1000
      prefix: tb_code_
    EPK_ID:
      generator: prefixed_id
      prefix: epk_
      cardinality: 1000000
    IP_ADDRESS:
      generator: documentation_ip_v4
    CARD_NUMBER:
      generator: fake_token
      prefix: card_token_
      cardinality: 1000000
    CHANNEL_TYPE:
      generator: dictionary
      cardinality: 20
      prefix: channel_type_
    USER_APP_VERSION:
      generator: dictionary
      cardinality: 50
      prefix: app_version_
    DEVICE_NAME:
      generator: dictionary
      cardinality: 5000
      prefix: device_name_
    DEVICE_ID:
      generator: prefixed_id
      prefix: device_id_
      cardinality: 1000000
    CONFIRM_LOG:
      generator: dictionary
      cardinality: 20
      prefix: confirm_
    MOBILE_SDK_DATA:
      generator: json_template
      template: mobile_sdk_v1
    DEVICE_MODEL:
      generator: dictionary
      cardinality: 100
      prefix: device_model_
    DEVICE_INFO:
      generator: dictionary
      cardinality: 1000
      prefix: device_info_
    FCP_CLIENT_ID:
      generator: prefixed_id
      prefix: client_
      cardinality: 1000000
    ORIGIN_UFS_BLOCK_ID:
      generator: dictionary
      cardinality: 1000
      prefix: ufs_
  storage_representation: native_orc_array_string
  raw_physical_columns:
  - paramName
  - paramValue
  preserve_parallel_array_indices: true
json_templates:
  mobile_sdk_v1:
    DeviceSystemName:
      generator: enum
      values:
      - iOS
      - Android
    DeviceSystemVersion:
      generator: enum
      values:
      - '18'
      - '19'
      - '20'
    Languages:
      generator: enum
      values:
      - ru_RU
      - en_US
    HardwareID:
      generator: fake_token
      prefix: hardware_
    ApplicationMD5:
      generator: hex_string
      length: 32
    BootId:
      generator: uuid_deterministic
reference_datasets:
  module_dictionary:
    enabled: true
    join_key: module
    columns:
    - id
    - type
    row_count: 500
  epk_dictionary:
    enabled: true
    join_key: EPK_ID
    columns:
    - id
    - type
    row_count: 100000
  partition_dates:
    enabled: true
    columns:
    - event_date
    - category
query_samples:
  keys:
  - userLogin
  - session
  - EPK_ID
  - SESSION_ID
  - IP_ADDRESS
  - CHANNEL_TYPE
  - DeviceSystemName
  selection: deterministic_from_materialized_dataset
  cases:
  - present
  - absent
  - selective
  - common
  values_per_case: 50
  partition_columns_derived:
    event_date: DATE(__time)
    event_hour: HOUR(__time)
validation:
  check_row_count: true
  check_name_value_alignment: true
  check_duplicate_names: true
  check_canonical_row_hash: true
  check_json_parseable: true
  check_null_handling: true
  fail_on_violation: true
  check_nested_types: true
