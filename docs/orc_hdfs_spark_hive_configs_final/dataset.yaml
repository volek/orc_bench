        SYSTEM_EVENTS_LOGON: [32, 40]
        SYSTEM_EVENTS_CREATE_SESSION_RESPONSE: 19
        SYSTEM_EVENTS_GET_EXTENDED_PERMISSIONS_MOBILE_RESPONSE: 17
