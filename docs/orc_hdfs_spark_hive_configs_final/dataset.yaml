      - SYSTEM_EVENTS_SEND_OPERATION_DATA_SBERKIDS_GUEST
      - SYSTEM_EVENTS_GET_CONFIGURATION_WEBVIEW_RESPONSE
      weights:
      - 6037221
      - 5943387
      - 5943317
      - 811676
      - 371027
      - 27659
      - 22807
      - 1573
      - 394
      params_per_event:
