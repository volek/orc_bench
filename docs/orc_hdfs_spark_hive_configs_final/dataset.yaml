      user_login: technical_constant
      epk_id: present
      session_id_param: present
    - order: 2
      name: SYSTEM_EVENTS_LOGON
      user_login: client_numeric_same_as_step_3
      epk_id: same_as_step_1
      session_id_param: present
    - order: 3
      name: SYSTEM_EVENTS_CREATE_SESSION_WITH_CONFIGURATION_RESPONSE
      user_login: client_numeric
      epk_id: absent
      session_id_param: absent
