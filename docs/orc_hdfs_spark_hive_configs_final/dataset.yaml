    module:
      generator: constant
      value: CI00982781_SM_UKO
      cardinality: 1
      length: 17
    name:
      generator: weighted_dictionary
      weight_basis: row counts in the median hour, normalize to 1
      values:
      - SYSTEM_EVENTS_CREATE_SESSION_WITH_CONFIGURATION_RESPONSE
      - SYSTEM_EVENTS_FIND
      - SYSTEM_EVENTS_LOGON
      - SYSTEM_EVENTS_CREATE_SESSION_RESPONSE
      - SYSTEM_EVENTS_GET_EXTENDED_PERMISSIONS_MOBILE_RESPONSE
      - SYSTEM_EVENTS_FORCE_MS_NOTIFICATION_RESPONSE
