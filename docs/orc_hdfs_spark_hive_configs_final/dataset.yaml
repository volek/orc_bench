  scales:
    S:
      purpose: one old-era hour, mechanism and layout experiments
      era: old
      hourly_partitions: 1
      target_compressed_gb: 9.7
      target_logical_gib: 262
      hour_key: '2025-04-14--12'
    M:
      purpose: one old-era day
      era: old
      hourly_partitions: 24
      target_compressed_gb: 233
      target_logical_gib: 6291
    L:
      purpose: typical query window, 120 hourly partitions (5 days)
      era: old
      hourly_partitions: 120
      target_compressed_gb: 1165
      target_logical_gib: 31455
      note: 5 × 233 GB. The analysis rounds this window to ≈1.17 TB. Materialize one layout at a time.
  generation:
    seed: 123456789
    algorithm_version: audit_synth_v2
    deterministic_by:
    - seed
    - row_id
    - column_name
    - algorithm_version
    batch_rows: 1024
    base_time_zone: UTC
    timestamp_range:
      profile: synthetic_old_era_slice
      note: median query depth is 545 days back into spring 2025, where hours are ~2.4× the new era. This slice 
        stands in for that era; it is not the full 2024-03-11..2026-10-21 history.
      from: '2025-04-14T00:00:00Z'
      to_exclusive: '2025-04-19T00:00:00Z'
    scale_window:
      S: hour 2025-04-14--12 sized to the old-era average hour (9.7 GB), not the diurnal peak
      M: 2025-04-14, hours follow hour_size_profile, sum 233 GB
      L: full timestamp_range, each day sums to 233 GB
    hour_size_profile:
      era: old
      median_compressed_gb: 9.7
      peak_hours_08_11_compressed_gb: 15
      night_hours_22_00_compressed_gb: 1.75
