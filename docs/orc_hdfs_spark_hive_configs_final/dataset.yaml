    source_materialization: once_per_scale
    row_count:
    strict_cardinality: true
    null_profile: declared_exceptions_only (see dataset.null_semantics)
    parallel_array_alignment: positionally_matched
    timezone_assumption_requires_validation: true
  session_model:
    note: a client login is a triple that shares session. FIND and LOGON also share EPK_ID. Events of one triple 
      fall within a few seconds. A session lookup must hit 3-8 rows.
    typical_events_per_session: 3
    p90_events_per_session: 4
    max_events_per_session: 1399
    epk_events_per_hour_typical: 2
    epk_events_p90: 4
    epk_events_max_per_hour: 72
    steps:
