# Cross-layer ORC/HDFS/Spark 3.2/Hive 3.1 contract, actualized to SM_UKO.
# spec_version 3 (2026-10-26): index CI02001608_CI00982781_SM_UKO (analysis 2026-10-21).
# Environment facts live only in environment.yaml. Hive/LLAP stays a side track.
benchmark:
  id: audit_orc_hdfs_spark_hive
  spec_version: 3
  # 2 hours: every logged cancel happened inside this horizon. A 120-partition
  # old-era session scan on profile common is about 2.8 h of Spark work.
  sla_mean_latency_ms: 7200000
  aspirational_optimized_latency_ms: 3000
  sla_note: 3000 ms applies only to Q_SESSION_EQ after a session bloom skips stripes. It is not the baseline SLA.
  isolation: one_variable_at_a_time_then_best_combinations
  require_result_equivalence: true
  hdfs_root: /orc_test
  generated_hive_ddl: generated/hive-table.sql
  derived_partition_columns:
  - key
  partition_key_format: yyyy-MM-dd--HH
  partition_grain: hour
  preservation_policy: A_original_RAW_ARRAY_immutable_plus_derived_MAP_FLAT_HYBRID
  source_reference: index CI02001608_CI00982781_SM_UKO analysis 2026-10-21
  raw_array_schema_verified: true
  vendor_specific_version_validation: true
  configuration_basis: real_orc_footer_plus_confirmed_sdp_cluster
  environment_facts_source: environment.yaml (single source per decision 2.15)
  inputs:
    schema: schema.orc.txt
    dataset: dataset.yaml
    environment: environment.yaml
    queries: query-suite.yaml
    profiling: profiling-suite.yaml
    observed_profile: observed-orc-profile.yaml
  physical_baseline:
    id: RAW_ARRAY_BASE
    representation: RAW_ARRAY
    partitioning:
    - key
    bucketing:
    sorting:
    - __time
    # Median-hour file is ~0.89 GB (six of these plus a 31 MB tail). Old-era average file is 1.27 GB.
    target_file_size_mib: 912
    orc:
      compression: ZLIB
      stripe_size_mib: 64
      create_index: true
      # Sample footer value. The index analysis does not reconfirm the stride.
      row_index_stride: 10000
      bloom:
        columns: []
        fpp: 0.01
      verified_from_index:
        compression: ZLIB
        compression_ratio: 27
        on_disk_stripe_mib: 8.043
        rows_per_stripe: 30902
        source: orc_meta_result.txt
        partition: 2026-06-28--09
        orc_file_version: V_0_12
        writer_identification: ORC_517 / ORC Java
        row_index_stride: 10000
        file_count: 7
        total_rows: 19159061
        total_file_bytes: 5341262459
        raw_data_size_bytes: 144428311475
        total_stripes: 620
        avg_rows_per_stripe: 30902
        avg_compressed_stripe_bytes: 8434171
      stripe_size_note: 64 MiB is benchmark writer target, NOT confirmed by footer; observed compressed mean is 
        8434171 bytes.
    observed_profile_ref: observed-orc-profile.yaml
    observed_file_sizes_bytes:
    - 31395453
    - 893366535
    - 892172242
    - 892729798
    - 892347297
    - 884051378
    - 855199756
    target_file_size_note: 912 MiB kept as generator setting; do not replace with seven-file mean skewed by a small
      first-timestamp file.
  representations:
    PAIRS:
      transform: zip_native_parallel_arrays_as_ordered_struct_array
      params_type: array<struct<name:string,value:string>>
      lossless_if:
      - aligned_arrays
      - preserves_order
      - preserves_duplicates
    MAP:
      transform: zip_native_parallel_arrays_into_map
      params_type: map<string,string>
      requires:
      - no_duplicate_parameter_names
    FLAT:
      transform: extract_selected_scalar_columns_from_native_arrays
      columns:
      - epk_id
      - operation_uid
      - card_number
      - ip_address
      - device_id
      - tb_code
      - osb_code
      - vsp_code
      keep_original_parameters: false
      lossless: false
    HYBRID:
      transform: retain_native_arrays_plus_selected_scalar_columns
      columns:
      - epk_id
      - operation_uid
      - card_number
      - ip_address
      - device_id
      - tb_code
      - osb_code
      - vsp_code
      keep_original_parameters: true
      lossless: true
    RAW_ARRAY:
      schema_source: schema.orc.txt
      physical_types: as_declared
      serialization: native_orc_array_string
      lossless: true
      immutable_source_baseline: true
  hive_registration:
    approved: dev, 2026-10-16
    database: bench
    fact_tables:
      pattern: bench.events__{scale}__{experiment}__{variant}
      scale_token: lower-case s|m|l
      experiment_token: lower-case experiment id
      variant_token: v0..vN in contract value order; single-layout experiments use v0
    reference_tables:
      module_dictionary: bench.module_dictionary
      epk_dictionary: bench.epk_dictionary
      partition_dates: bench.partition_dates
      sm_uko_note: unused by the SM_UKO mix. module is constant, EPK comes from a file, partitions are chosen 
        outside SQL.
    epk_id_file:
      distinct_ids: 10800
      approx_kib: 216
      binding: epk_id_list
    placeholder_binding:
      table: fact table of current experiment/variant
      module_dictionary_table: bench.module_dictionary
      epk_dictionary_table: bench.epk_dictionary
      date_dimension_table: bench.partition_dates
    ddl_execution:
      file: generated/hive-table.sql (relative to runner working dir, regenerated on prepare)
      generator: runner
      executor: runner via JDBC (kerberos ticket) before Hive stage; Spark reads same metastore via spark_catalog
      mode: drop_and_create per variant (idempotent on resume)
      permission_verified: environment hive.ddl_execution_verified (probe 2026-10-16)
    bucketing_mode: managed_hive_table written by Hive-on-Tez, data under {hdfs_root}/layouts/...
    lifecycle: tables of cleaned layouts dropped together with layout (execution_policy, 2.7)
  physical_experiments:
  - id: ORC_COLUMN_PRUNING
    kind: query_only
    based_on: RAW_ARRAY_BASE
    note: prod queries are SELECT *. This pair isolates projection on the equality predicate.
    queries:
    - Q_SESSION_EQ
    - Q_SESSION_EQ_NARROW
  - id: ORC_PUSHDOWN
    kind: reader_settings
    based_on: RAW_ARRAY_BASE
    variants:
    - false
    - true
    note: ILIKE and LIKE do not push down; equality can.
    queries:
    - Q_SESSION_ILIKE
    - Q_SESSION_EQ
    - Q_EPK_SPARK
    - Q_USERLOGIN
  - id: MINMAX_SORT
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: sorting
    note: production files are already ordered by __time. The empty list is the control.
    values:
    - []
    - - __time
    queries: &id001
    - Q_SESSION_ILIKE
    - Q_SESSION_EQ
    - Q_EPK_SPARK
    - Q_USERLOGIN
    engine: SPARK_BASE
  - id: BLOOM_SESSION
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: bloom_columns
    note: replaces BLOOM_USER. Session is 79% of queries. userLogin is about 1% and is not a bloom target.
    values:
    - []
    - - session
    queries: *id001
    engine: SPARK_BASE
  - id: BLOOM_FPP
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: bloom_fpp
    values:
    - 0.05
    - 0.01
    - 0.001
    requires_bloom_columns:
    - session
    queries: *id001
    engine: SPARK_BASE
  - id: ROW_INDEX
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: row_index_stride
    values:
    - 5000
    - 10000
    - 20000
    - 50000
    queries: *id001
    engine: SPARK_BASE
  - id: STRIPE_SIZE
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: stripe_size_mib
    values:
    - 64
    - 128
    - 256
    queries: *id001
    engine: SPARK_BASE
  - id: COMPRESSION
    kind: rewrite
    based_on: RAW_ARRAY_BASE
    factor: compression
    values:
    - ZLIB
    - SNAPPY
    - ZSTD
    queries: *id001
    engine: SPARK_BASE
  - id: PARTITIONING
    kind: rewrite
    factor: partition_columns
    note: production is always hourly. The empty list is the control. SQL still has no time predicate; the runner 
      passes the partition list.
    values:
    - []
    - - key
    based_on: RAW_ARRAY_BASE
    queries:
    - Q_SESSION_ILIKE
    engine: SPARK_BASE
  - id: BUCKETING
    kind: hive_compatible_write
    status: excluded_from_sm_uko
    reason: the index is not bucketed. Lookups are session and EPK scans, and module is a constant.
    factor: bucket_count
    values:
    - 0
    - 32
    bucket_key: epk_id
    representation: HYBRID
    queries: []
    engine: SPARK_BASE
  - id: FILE_SIZES
    kind: rewrite
    factor: target_file_size_mib
    note: 912 is the median-hour file (~0.89 GB). 1300 is the old-era average file (1.27 GB). 256 is the previous 
      contract.
    values:
    - 256
    - 912
    - 1300
    based_on: RAW_ARRAY_BASE
    queries: *id001
    engine: SPARK_BASE
  - id: SHORT_CIRCUIT
    kind: cluster_read
    variants:
    - false
    - true
    requires:
    - hdfs_short_circuit_supported
    - client_datanode_colocation
    queries:
    - Q_SESSION_ILIKE
    engine: SPARK_BASE
  - id: HDFS_CACHE
    kind: cluster_read
    variants:
    - cold
    - naturally_warm
    - centralized
    requires_for_centralized:
    - centralized_cache_supported
    queries:
    - Q_SESSION_ILIKE
    engine: SPARK_BASE
  - id: NESTED_REPRESENTATIONS
    kind: rewrite
    factor: representation
    values:
    - RAW_ARRAY
    - MAP
    - FLAT
    - HYBRID
    queries:
    - Q_EPK_SPARK
    - Q_EPK_HIVE
    - Q_EPK_MAP
    - Q_EPK
    engine: SPARK_BASE
    representation_rewrites_ref: query_suite.representation_rewrites
    based_on: RAW_ARRAY_BASE
  - id: NESTED_SCALAR_BLOOM
    kind: rewrite
    status: excluded_from_sm_uko
    reason: EPK_ID lives inside paramValue. The analysis recommends a bloom on the top-level session column.
    representation: HYBRID
    factor: bloom_columns
    values:
    - []
    - - epk_id
    based_on: RAW_ARRAY_BASE
    queries: []
    engine: SPARK_BASE
  - id: NESTED_SCALAR_SORT
    kind: rewrite
    status: excluded_from_sm_uko
    reason: production files are ordered by __time. Sorting by epk_id is not a logged access path.
    representation: HYBRID
    factor: sorting
    values:
    - []
    - - __time
    based_on: RAW_ARRAY_BASE
    queries: []
    engine: SPARK_BASE
  - id: PARTITION_SCOPE
    kind: runner_partition_list
    note: SQL has no time predicate. The runner supplies key partitions in batches of 20.
    batch_size: 20
    queries:
    - Q_SESSION_ILIKE
  execution_baselines:
    spark:
      spark.sql.orc.impl: native
      spark.sql.orc.enableVectorizedReader: true
      spark.sql.orc.filterPushdown: true
      spark.sql.adaptive.enabled: true
      spark.sql.optimizer.dynamicPartitionPruning.enabled: true
      spark.sql.orc.enableNestedColumnVectorizedReader: false
      spark.sql.hive.convertMetastoreOrc: true
    hive:
      hive.execution.engine: tez
      hive.vectorized.execution.enabled: true
      hive.cbo.enable: true
      hive.llap.execution.mode: only
      comment: Observed LLAP mode=only. HIVE_TEZ_BASE must explicitly override to none, subject to session override
        permissions.
  engine_profiles:
    SPARK_BASE:
      extends: execution_baselines.spark
      sizing_profile: layout_probe
    SPARK_COMMON:
      extends: execution_baselines.spark
      sizing_profile: prod_common
      note: same SQL conf as SPARK_BASE. Resources are archive-query common (environment.spark).
    SPARK_OPTIMIZED:
      extends: execution_baselines.spark
      set:
        spark.sql.cbo.enabled: 'true'
        spark.sql.autoBroadcastJoinThreshold: 10485760
        spark.sql.orc.enableNestedColumnVectorizedReader: true
      prepare: ANALYZE TABLE on participating tables
    HIVE_TEZ_BASE:
      extends: execution_baselines.hive
      set:
        hive.llap.execution.mode: none
    HIVE_TEZ_OPTIMIZED:
      status: excluded_from_final
      reason: baseline already enables vectorization+CBO; no distinct lever defined (decision 2026-10-16)
    HIVE_LLAP_COLD:
      extends: execution_baselines.hive
      set:
        hive.llap.execution.mode: only
      cache_state: cold (cache_state_definitions)
    HIVE_LLAP_WARM:
      extends: execution_baselines.hive
      set:
        hive.llap.execution.mode: only
      cache_state: warm (cache_state_definitions)
  engine_experiments:
    spark:
    - id: SPARK_VECTORIZATION
      property: spark.sql.orc.enableVectorizedReader
      values:
      - false
      - true
      queries:
      - Q_SESSION_ILIKE
      - Q_FULLTEXT
      - Q_EPK_SPARK
    - id: SPARK_AQE
      property: spark.sql.adaptive.enabled
      values:
      - false
      - true
      note: prod filters do not aggregate. AQE is secondary, on the heavy templates only.
      queries:
      - Q_FULLTEXT
      - Q_MODULE_NAME_EPK_FILE
    - id: SPARK_DPP
      property: spark.sql.optimizer.dynamicPartitionPruning.enabled
      status: excluded_from_sm_uko
      reason: partition scope is a list supplied by the runner, not a join to a date dimension.
      values:
      - false
      - true
      queries: []
    - id: SPARK_CBO
      property: spark.sql.cbo.enabled
      status: excluded_from_sm_uko
      reason: the logged workload has no joins and no aggregations.
      values:
      - false
      - true
      queries: []
    - id: SPARK_BROADCAST
      property: spark.sql.autoBroadcastJoinThreshold
      status: excluded_from_sm_uko
      reason: the logged workload has no joins.
      values:
      - -1
      - 10485760
      queries: []
    - id: SPARK_ORC_READER
      property: spark.sql.orc.impl
      values:
      - native
      - hive
      queries:
      - Q_SESSION_EQ
      - Q_EPK_SPARK
    - id: SPARK_NESTED_VECTORIZATION
      property: spark.sql.orc.enableNestedColumnVectorizedReader
      values:
      - false
      - true
      queries:
      - Q_EPK_SPARK
      requires:
      - native_orc_reader
      - nested_columns
    hive:
    - id: HIVE_VECTORIZATION
      property: hive.vectorized.execution.enabled
      values:
      - false
      - true
      note: Hive is not the SM_UKO archive-query path. Queries here are the LIKE equivalents.
      queries:
      - Q_SESSION_EQ
      - Q_USERLOGIN
      - Q_EPK_HIVE
    - id: HIVE_CBO
      property: hive.cbo.enable
      status: excluded_from_sm_uko
      reason: the logged workload has no joins and no aggregations.
      values:
      - false
      - true
      queries: []
    - id: HIVE_TEZ_BASE
      engine: tez
      llap: false
      queries:
      - Q_SESSION_LIKE_HIVE
      - Q_SESSION_EQ
      - Q_USERLOGIN
      - Q_UNFILTERED
      session_overrides:
        hive.llap.execution.mode: none
      requires:
      - hive_session_allows_mode_override
    - id: HIVE_LLAP
      engine: tez
      llap: true
      cache_states:
      - cold
      - warm
      queries:
      - Q_SESSION_LIKE_HIVE
      - Q_SESSION_EQ
      - Q_USERLOGIN
      - Q_UNFILTERED
      - Q_FULLTEXT
      session_overrides:
        hive.llap.execution.mode: only
      requires:
      - llap_daemons_running
      - llap_task_execution_verified
    - id: HIVE_LLAP_CACHE
      engine: tez
      llap: true
      working_set_fractions:
      - 0.25
      - 0.5
      - 1.0
      session_overrides:
        hive.llap.execution.mode: only
      requires:
      - llap_daemons_running
      - llap_task_execution_verified
      queries:
      - Q_SESSION_LIKE_HIVE
      - Q_SESSION_EQ
    - id: HIVE_MATERIALIZED_VIEW
      status: excluded_from_sm_uko
      reason: materialized views are not supported on this cluster, and the log has no such query
      requires:
      - materialized_views_supported
      queries: []
    - id: HIVE_LLAP_PREFLIGHT
      requires:
      - tez_version_verified
      - llap_daemons_available
      on_missing: skip_not_fail
  final_comparison:
    physical_dataset: BEST_ORC
    engines:
    - SPARK_COMMON
    require_identical_file_manifest: true
    require_equal_query_results: true
    queries:
    - Q_SESSION_ILIKE
    - Q_SESSION_EQ
    - Q_EPK_SPARK
    - Q_FULLTEXT
    - Q_USERNODE
    - Q_USERLOGIN
    - Q_MODULE_NAME_EPK_FILE
    - Q_OTHER_PARAM
    - Q_ABSENT_PARAM
    - Q_UNFILTERED
    excluded_queries:
      Q_SESSION_EQ_NARROW: column-pruning contrast only
  orc_engine_track:
    note: Hive/LLAP is not how this index is queried. Profiles stay for a separate ORC comparison.
    engines:
    - HIVE_TEZ_BASE
    - HIVE_LLAP_COLD
    - HIVE_LLAP_WARM
    - SPARK_BASE
  cache_state_definitions:
    cold: first measured run before warmup loop
    warm: measured runs after warmup_per_query=5
    llap_cold: same rule without cache reset (no permission); results flagged observational
    llap_warm: same rule; results flagged observational
  result_equivalence:
    canonical_projection: columns of schema.orc.txt
    drop_partition_columns: true
    map_normalization: to positional key/value arrays ordered by key
    hybrid_extracted_scalars: excluded from hash (RAW_ARRAY has no such columns)
    null_encoding: \N
    timestamp_encoding: epoch microseconds
    array_separator: '0x1F'
    hash: SHA-256 over sorted per-row 128-bit row hashes
    scope: identical rules for Spark and Hive
    fulltext_hashes: engine-local, because CAST of arrays renders differently
  best_orc_rule:
    objective: min p50 over {Q_SESSION_EQ}
    report_queries:
    - Q_SESSION_ILIKE
    - Q_EPK_SPARK
    - Q_FULLTEXT
    - Q_USERNODE
    - Q_USERLOGIN
    sla_gate: success_rate >= 0.95
    tie_break: session bloom > time-sorted hourly baseline
    excluded_candidates: ZSTD (Hive side ORC 1.5.6 codec gap; Spark ZSTD kept; Hive ZSTD deferred until codec 
      support)
  execution_policy:
    layout_lifetime: materialized on prepare, cleaned after stage (except candidates / --keep-layouts)
    idempotency: '{hdfs_root}/state/*.done markers; resume never overwrites existing markers'
    timeouts:
      generate: calibrated by pilot run
      run: 10 x p95 measured
    capacity_check: warn (per-datanode free space, cluster is skewed per report 2026-10-16)
    scales: S=1 old-era hour / M=1 day / L=120 hours per dataset.yaml; L is one layout at a time
    partition_read:
      batch_size: 20
      typical_session_query_batches: 6
      mode: runner supplies partition paths; SQL has no time predicate
  runs:
    warmup_per_query: 5
    measured_per_query: 30
    workload_mix_source: query_suite.workload_mix
    measurement_note: each template is timed on its own. Mix weights score the combination; rare templates are 
      still measured.
    # Common profile fits about 9 apps on an idle pool (81 cores / 9). 25 and 50 do not fit.
    concurrency_levels:
    - 1
    - 5
    - 9
    concurrency_policy: prod_common_core_bound
    cache_states_not_aggregated: true
    record_explain_plans: true
    compare_complete_results: true
    timing_scope: spark event log, application start through application end
    timing_note: Postgres final_status_ts includes the archive-query queue and is not a benchmark metric.
    max_fetch_rows: 10000000
    max_fetch_note: covers the 6.5e6-row EPK-file case. The journal outlier of 1.056e10 rows is outside NT.
  metrics:
    required:
    - latency_ms
    - status
    - result_hash
    - logical_rows
    - orc_file_bytes
    - hdfs_bytes_read
    - engine_plan
    optional:
    - p50_ms
    - p95_ms
    - p99_ms
    - rows_read
    - files_opened
    - partitions_selected
    - cpu_ms
    - shuffle_read_bytes
    - shuffle_write_bytes
    - spill_bytes
    - cache_hit_ratio
    - yarn_queue_delay_ms
    - executor_alloc_delay_ms
    - spark_runtime_ms
    unavailable_metric_value:
    sla_success_threshold_ms: 7200000
    aspirational_optimized_latency_ms: 3000
  configuration_validation:
    reject_query_referencing_missing_column: true
    require_reader_profile_override_applied: true
    require_identical_canonical_row_hash_across_variants: true
    require_physical_manifest_for_final_engine_comparison: true
    require_nested_parameter_alignment: true

  # Optional independent profiling stage, distinct from production performance tests.
  # Adding this declaration does not by itself implement runner/ConfigLoader integration.
  profiling_stage:
    enabled: false  # enable after implementing profiling runner support
    source: profiling-suite.yaml
    original_sql: spark_queries.sql
    engine: SPARK_BASE
    representation: RAW_ARRAY
    use_original_hdfs_paths: true
    groups:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    - '9'
    separate_from_workload_mix: true
    validation:
      compare_aggregates_per_query: true
      compare_null_distributions: true
      compare_parameter_cardinality: true
      compare_epk_distribution: true
      compare_partition_distributions: true
      approximate_statistics_tolerance:       # calibrate; do not invent one
      raw_row_hash_rule_not_applicable_to_aggregates: true
      compare_with_observed_reference: true
      do_not_assume_other_spark_queries_results_available: true
    observed_profile_ref: observed-orc-profile.yaml
  profiling_spark_settings:
    spark.sql.sources.partitionColumnTypeInference.enabled: false
    spark.sql.ansi.enabled: false
