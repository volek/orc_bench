# SQL scenario contracts for index CI02001608_CI00982781_SM_UKO.
# spec_version 3 (2026-10-26). Production path is Spark archive-query on RAW_ARRAY.
# The service chooses hourly partitions outside SQL and reads them in batches of 20.
# SQL itself has no time predicate. Every prod statement is SELECT * ORDER BY __time DESC.
# Hive/LLAP is a separate ORC track: ILIKE is Spark-only; Hive variants use LIKE.
query_suite:
  id: audit_queries_sm_uko
  spec_version: 3
  defaults:
    table: events
    module_value: CI00982781_SM_UKO
    event_name: SYSTEM_EVENTS_LOGON
    partition_hours: 120
    partition_batch_size: 20
    partition_key_format: yyyy-MM-dd--HH
  parameter_source: dataset_manifest_query_samples
  dialects:
  - spark_3_2
  - hive_tez
  source_schema_status: index_inventory_2026-10-21
  baseline_representation: RAW_ARRAY
  column_contract:
    original_schema: schema.orc.txt
    event_hour_key: derived_partition_column_named_key
    sql_time_predicate: absent
    EPK_ID: located_by_matching_paramName_and_paramValue_position
    raw_arrays: array<string>
    spark_array_index: element_at and array_position are 1-based; do not subtract 1 the way the archive SQL does
  sql_template_escaping: runner_must_escape_and_quote_values_by_dialect
  # Spark array subscripts [] are 0-based; element_at() and array_position() are 1-based.
  # Source uses paramValue[CAST(array_position(paramName, 'EPK_ID') - 1 AS INT)].
  # Existing templates use element_at(paramValue, array_position(...)) and are equivalent for present keys.
  spark_array_indexing:
    array_subscript: zero_based
    array_position: one_based
    element_at: one_based
    source_expression: "paramValue[CAST(array_position(paramName, 'EPK_ID') - 1 AS INT)]"
    template_expression: "element_at(paramValue, array_position(paramName, 'EPK_ID'))"
  partition_scope:
    mode: external_partition_list
    key_column: key
    key_format: yyyy-MM-dd--HH
    batch_size: 20
    typical_session_batches: 6
    sql_has_time_predicate: false
    fallback_window_hours: 120
    fallback_note: groups without a single logged window use 120 hours, the dominant window in the log
  workload_mix:
    note: shares are exact group counts over 1107 queries (2026-07-01..2026-09-30). Section 4.4 rounds the same 
      mix.
    queries:
    - query: Q_SESSION_ILIKE
      share: 0.7904
      count: 875
      partition_hours: 120
    - query: Q_EPK_SPARK
      share: 0.0967
      count: 107
      partition_hours: 120
      partition_hours_observed: 1-31 days
    - query: Q_FULLTEXT
      share: 0.0506
      count: 56
      partition_hours: 120
      partition_hours_observed: 0.4-17 days
    - query: Q_USERNODE
      share: 0.0104
      count_group: 23
      note: userNode and userLogin are one logged group; the split of 23 queries is not published
      partition_hours: 120
      partition_hours_observed: 1-5 days
    - query: Q_USERLOGIN
      share: 0.0104
      count_group: 23
      partition_hours: 120
    - query: Q_MODULE_NAME_EPK_FILE
      share: 0.0181
      count: 20
      partition_hours: 360
    - query: Q_ABSENT_PARAM
      share: 0.0117
      count: 13
      partition_hours: 120
    - query: Q_OTHER_PARAM
      share: 0.0054
      count: 6
      partition_hours: 120
      partition_hours_observed: 1-4 days
    - query: Q_UNFILTERED
      share: 0.0063
      count: 7
      partition_hours: 216
  representation_rewrites:
    note: production workload stays RAW_ARRAY. Rewrites apply only to the EPK lookup experiment.
    RAW_ARRAY:
      Q_EPK: Q_EPK_SPARK (spark_3_2) / Q_EPK_HIVE (hive_tez)
    MAP:
      Q_EPK: Q_EPK_MAP
    FLAT: native queries
    HYBRID: native queries
  queries:
  - id: Q_SESSION_ILIKE
    description: Production session lookup. 79% of queries, 54% of time, about 4 rows (8 when OR of two sessions). 
      CAST+ILIKE reads every row; bloom does not apply.
    dialects:
    - spark_3_2
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 4
    sql: |
      SELECT * FROM ${table}
      WHERE CAST(session AS STRING) ILIKE '${session_id_outer}'
      ORDER BY `__time` DESC
  - id: Q_SESSION_LIKE_HIVE
    description: Hive stand-in for the session lookup. Session is hex, so LIKE matches ILIKE on these values.
    dialects:
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 4
    sql: |
      SELECT * FROM ${table}
      WHERE CAST(session AS STRING) LIKE '${session_id_outer}'
      ORDER BY `__time` DESC
  - id: Q_SESSION_EQ
    description: Optimized session predicate. Equality can use a bloom on session and skip stripes. This is the 
      lever from analysis §3.10, not the predicate prod sends today.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 4
    sql: |
      SELECT * FROM ${table}
      WHERE session = '${session_id_outer}'
      ORDER BY `__time` DESC
  - id: Q_SESSION_EQ_NARROW
    description: Same equality as Q_SESSION_EQ with a narrow projection, for the column-pruning contrast. Prod 
      always selects every column.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 4
    sql: |
      SELECT session, createdAt, `__time` FROM ${table}
      WHERE session = '${session_id_outer}'
      ORDER BY `__time` DESC
  - id: Q_EPK
    description: EPK lookup on an extracted column. Native form for FLAT and HYBRID. Prod reads the parallel 
      arrays, not this column.
    dialects:
    - spark_3_2
    representations:
    - FLAT
    - HYBRID
    partition_hours: 120
    expect_rows: 0-25
    sql: |
      SELECT * FROM ${table}
      WHERE name = '${event_name}'
        AND CAST(epk_id AS STRING) ILIKE '${epk_id}'
      ORDER BY `__time` DESC
  - id: Q_EPK_SPARK
    description: Production EPK lookup on RAW_ARRAY. Archive SQL uses paramValue[ARRAY_POSITION(paramName, 
      'EPK_ID') - 1] because that dialect is 0-based. Spark element_at and array_position are 1-based, so this form
      does not subtract 1. EPK_ID exists only on FIND and LOGON.
    dialects:
    - spark_3_2
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 0-25
    sql: |
      SELECT * FROM ${table}
      WHERE name = '${event_name}'
        AND array_contains(paramName, 'EPK_ID')
        AND element_at(paramValue, array_position(paramName, 'EPK_ID')) ILIKE '${epk_id}'
      ORDER BY `__time` DESC
  - id: Q_EPK_HIVE
    description: Hive positional expansion for the EPK lookup. posexplode positions are 0-based.
    dialects:
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 0-25
    sql: |
      SELECT e.* FROM ${table} e
      LATERAL VIEW posexplode(e.paramName) p AS pos, param_key
      WHERE e.name = '${event_name}'
        AND p.param_key = 'EPK_ID'
        AND e.paramValue[p.pos] LIKE '${epk_id}'
      ORDER BY e.`__time` DESC
  - id: Q_EPK_MAP
    description: Map representation of the EPK lookup. Spark uses ILIKE; run the Hive track with LIKE if ILIKE is 
      rejected.
    dialects:
    - spark_3_2
    representations:
    - MAP
    partition_hours: 120
    expect_rows: 0-25
    sql: |
      SELECT * FROM ${table}
      WHERE name = '${event_name}'
        AND CAST(params['EPK_ID'] AS STRING) ILIKE '${epk_id}'
      ORDER BY `__time` DESC
  - id: Q_FULLTEXT
    description: UI "search everywhere" expands to 16 OR predicates of CAST(col AS STRING) LIKE. The analysis names
      paramName, paramValue, tags and userNode and does not list the other 12. The list below is the string and 
      array columns excluding timestamps and requestId, and is unconfirmed. Cast rendering differs by engine, so 
      result hashes stay engine-local. 5% of queries and 23% of time.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    column_list_status: unconfirmed_16
    partition_hours: 120
    expect_rows: 0-42
    expect_rows_heavy_template: 260000
    sql: |
      SELECT * FROM ${table}
      WHERE CAST(paramName AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(paramValue AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(tags AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(userNode AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(userLogin AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(session AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(name AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(module AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(userName AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(sourceSystem AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(nodeId AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(id AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(archiveInternalId AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(paramOldValue AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(metamodelVersion AS STRING) LIKE '${fulltext_pattern}'
         OR CAST(metamodelHash AS STRING) LIKE '${fulltext_pattern}'
      ORDER BY `__time` DESC
  - id: Q_USERNODE
    description: name plus userNode LIKE. Part of the 23-query group (2% of queries, 9.5% of time) that averages 
      about 19 hours.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 8-73
    sql: |
      SELECT * FROM ${table}
      WHERE name = '${event_name}'
        AND CAST(userNode AS STRING) LIKE '${user_node}'
      ORDER BY `__time` DESC
  - id: Q_USERLOGIN
    description: name plus userLogin LIKE. Same logged group as Q_USERNODE.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 8-73
    sql: |
      SELECT * FROM ${table}
      WHERE name = '${event_name}'
        AND CAST(userLogin AS STRING) LIKE '${user_login}'
      ORDER BY `__time` DESC
  - id: Q_MODULE_NAME_EPK_FILE
    description: module and name plus an external file of about 10800 EPK_ID values (~216 KiB). module is a 
      constant, so it prunes nothing. The runner expands ${epk_id_list} from the file. Result is 350 thousand to 
      6.5 million rows. Typical window is 15 days; two logged queries used 128 days.
    dialects:
    - spark_3_2
    representations:
    - RAW_ARRAY
    partition_hours: 360
    expect_rows: 350000-6500000
    sql: |
      SELECT * FROM ${table}
      WHERE module = '${module_value}'
        AND name = '${event_name}'
        AND array_contains(paramName, 'EPK_ID')
        AND element_at(paramValue, array_position(paramName, 'EPK_ID')) IN (${epk_id_list})
      ORDER BY `__time` DESC
  - id: Q_MODULE_NAME_EPK_FILE_HIVE
    description: Hive form of the EPK file filter.
    dialects:
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 360
    expect_rows: 350000-6500000
    sql: |
      SELECT e.* FROM ${table} e
      LATERAL VIEW posexplode(e.paramName) p AS pos, param_key
      WHERE e.module = '${module_value}'
        AND e.name = '${event_name}'
        AND p.param_key = 'EPK_ID'
        AND e.paramValue[p.pos] IN (${epk_id_list})
      ORDER BY e.`__time` DESC
  - id: Q_OTHER_PARAM
    description: Lookup of a real nested parameter other than EPK_ID. Template uses OPERATION_UID. Logged volume is
      6 queries, 0-3 rows.
    dialects:
    - spark_3_2
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 0-3
    sql: |
      SELECT * FROM ${table}
      WHERE array_contains(paramName, 'OPERATION_UID')
        AND element_at(paramValue, array_position(paramName, 'OPERATION_UID')) ILIKE '${operation_uid}'
      ORDER BY `__time` DESC
  - id: Q_ABSENT_PARAM
    description: Lookup of a parameter the index does not contain (STAFF_LOGIN and the six siblings in 
      dataset.parameters.absent_from_index). Result is always empty. 13 queries, about 5% of logged time.
    dialects:
    - spark_3_2
    representations:
    - RAW_ARRAY
    partition_hours: 120
    expect_rows: 0
    sql: |
      SELECT * FROM ${table}
      WHERE array_contains(paramName, 'STAFF_LOGIN')
        AND element_at(paramValue, array_position(paramName, 'STAFF_LOGIN')) ILIKE '${absent_param_value}'
      ORDER BY `__time` DESC
  - id: Q_UNFILTERED
    description: No predicate. 7 queries over 9 days, about 2.3 million rows. Partition list is still applied 
      outside SQL.
    dialects:
    - spark_3_2
    - hive_tez
    representations:
    - RAW_ARRAY
    partition_hours: 216
    expect_rows: 2300000
    sql: |
      SELECT * FROM ${table}
      ORDER BY `__time` DESC

  # Profiling is separate from production workload_mix and cannot be assigned its weights.
  profiling_suite_ref: profiling-suite.yaml
  profiling_separate_from_workload_mix: true
  observed_profile_ref: observed-orc-profile.yaml
