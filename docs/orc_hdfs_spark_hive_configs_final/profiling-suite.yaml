  - id: PROFILE_4_03
    kind: query
    section: '4'
    source_line: 314
    sql: "SELECT CASE WHEN cnt = 1 THEN '000001'\n            WHEN cnt <= 5 THEN '000002-5'\n            WHEN cnt <=
      10 THEN '000006-10'\n            WHEN cnt <= 50 THEN '000011-50'\n            WHEN cnt <= 100 THEN '000051-100'\n\
      \            WHEN cnt <= 1000 THEN '000101-1000'\n            WHEN cnt <= 10000 THEN '001001-10000'\n         \
      \   ELSE '010001+' END AS events_per_epk,\n       count(*) AS epk_cnt,\n       sum(cnt) AS events\nFROM (SELECT
      epk, count(*) AS cnt FROM p WHERE epk IS NOT NULL GROUP BY epk) t\nGROUP BY 1\nORDER BY 1;"
