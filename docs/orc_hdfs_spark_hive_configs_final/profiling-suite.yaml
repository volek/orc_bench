  - id: PROFILE_4_01
    kind: query
    section: '4'
    source_line: 296
    sql: "SELECT count(*)                                                                   AS rows_total,\n       sum(IF(epk
      IS NOT NULL, 1, 0))                                             AS rows_with_epk,\n       approx_count_distinct(epk)\
      \                                                 AS distinct_epk,\n       percentile_approx(array_position(paramName,
