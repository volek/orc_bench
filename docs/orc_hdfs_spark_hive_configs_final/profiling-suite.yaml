  - id: PROFILE_6_01
    kind: query
    section: '6'
    source_line: 393
    sql: 'SELECT date_format(createdAt, ''yyyy-MM-dd HH'') AS hh, count(*) AS cnt

      FROM p GROUP BY 1 ORDER BY 1;'
    requires_views:
    - part_raw
    - p
  - id: PROFILE_6_02
    kind: query
    section: '6'
    source_line: 397
    sql: "SELECT sum(IF(`__time` = createdAt, 1, 0))                                                     AS time_eq_createdAt,\n\
      \       percentile_approx(unix_timestamp(`__time`) - unix_timestamp(createdAt), array(0.01, 0.5, 0.99)) AS time_minus_created_sec_p1_50_99,\n\
      \       percentile_approx(unix_timestamp(archiveInsertTime) - unix_timestamp(createdAt), array(0.5, 0.9, 0.99))
      AS insert_lag_sec_p50_90_99,\n       max(unix_timestamp(archiveInsertTime) - unix_timestamp(createdAt))       \
      \                AS insert_lag_sec_max\nFROM p;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_6_03
    kind: query
    section: '6'
    source_line: 405
    sql: "SELECT sum(IF(date_format(`__time`, f) <> k, 1, 0))           AS time_outside_partition,\n       sum(IF(date_format(createdAt,
      f) <> k, 1, 0))          AS createdAt_outside_partition,\n       sum(IF(date_format(archiveInsertTime, f) <> k,
      1, 0))  AS insertTime_outside_partition,\n       count(*)                                               AS rows_total\n\
      FROM p\nCROSS JOIN (SELECT '<PARTITION_KEY>' AS k,\n                   IF(length('<PARTITION_KEY>') <= 11, 'yyyy-MM--dd',
      'yyyy-MM-dd--HH') AS f) pk;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_7_01
    kind: query
    section: '7'
    source_line: 418
    sql: 'SELECT percentile_approx(files, array(0.5, 0.9, 0.99)) AS files_per_epk_p50_90_99, max(files) AS files_per_epk_max

      FROM (SELECT epk, count(DISTINCT src_file) AS files FROM p WHERE epk IS NOT NULL GROUP BY epk) t;'
    requires_views:
    - part_raw
    - p
  - id: PROFILE_7_02
    kind: query
    section: '7'
    source_line: 421
    sql: 'SELECT name, count(DISTINCT src_file) AS files, count(*) AS cnt

      FROM p GROUP BY name ORDER BY cnt DESC LIMIT 50;'
    requires_views:
