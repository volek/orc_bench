    source_line: 425
    sql: "SELECT percentile_approx(span_sec, array(0.1, 0.5, 0.9)) AS file_time_span_sec_p10_50_90\nFROM (SELECT src_file,
      unix_timestamp(max(`__time`)) - unix_timestamp(min(`__time`)) AS span_sec\n      FROM p GROUP BY src_file) t;"
    requires_views:
