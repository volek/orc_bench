      \                 AS partitions_per_epk_max,\n       percentile_approx(cnt, array(0.5, 0.9, 0.99, 0.999))   AS
      events_per_epk_in_period_p50_90_99_999,\n       max(cnt)                                                AS events_per_epk_in_period_max\n\
      FROM (SELECT epk, count(DISTINCT key) AS parts, count(*) AS cnt FROM pr WHERE epk IS NOT NULL GROUP BY epk) t;"
