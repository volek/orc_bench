    - p
    - pp
  - id: PROFILE_3_11
    kind: query
    section: '3'
    source_line: 284
    sql: "SELECT name,\n       approx_count_distinct(concat_ws(',', array_sort(paramName))) AS distinct_param_sets,\n\
      \       count(*)                                                     AS cnt\nFROM p\nGROUP BY name\nORDER BY cnt
