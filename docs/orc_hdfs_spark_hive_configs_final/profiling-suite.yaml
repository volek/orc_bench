# Generated from spark_queries.sql; SQL unchanged. Runner support must be implemented separately.
profiling_suite:
  id: sm_uko_original_spark_profiling
  purpose: reproduce_original_orc_index_profiling_separately_from_production_workload
  source_file: spark_queries.sql
  dialect: spark_3_2
  execution_support: requires_runner_extension; not loaded by existing ConfigLoader
  source_query_fidelity: SQL statement bodies preserved from spark_queries.sql; original source included
  placeholders:
    INDEX_PATH: original_index_hdfs_directory
    PARTITION_KEY: selected_hour_partition
    RANGE_KEYS: explicit_partition_glob
  partition_scope:
    single_partition_sections:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    - '8'
    cross_partition_sections:
    - '9'
    external_partition_list_for_query_suite: separate_mode
  session_settings:
    spark.sql.sources.partitionColumnTypeInference.enabled: false
    spark.sql.ansi.enabled: false
  setup_statements:
  - id: PROFILE_0_01
    kind: set
    section: '0'
    source_line: 39
    sql: SET spark.sql.sources.partitionColumnTypeInference.enabled=false;
  - id: PROFILE_0_02
    kind: set
    section: '0'
    source_line: 40
    sql: SET spark.sql.ansi.enabled=false;
  - id: PROFILE_0_03
    kind: view
    section: '0'
    source_line: 43
    sql: 'CREATE OR REPLACE TEMPORARY VIEW part_raw USING orc

      OPTIONS (path ''<INDEX_PATH>/key=<PARTITION_KEY>'', basePath ''<INDEX_PATH>'');'
  - id: PROFILE_0_04
    kind: view
    section: '0'
    source_line: 46
    sql: "CREATE OR REPLACE TEMPORARY VIEW p AS\nSELECT *,\n       input_file_name() AS src_file,\n       length(to_json(struct(*)))
      AS row_json_len,\n       CASE WHEN array_position(paramName, 'EPK_ID') > 0\n            THEN paramValue[CAST(array_position(paramName,
      'EPK_ID') - 1 AS INT)] END AS epk\nFROM part_raw;"
  - id: PROFILE_0_05
    kind: view
    section: '0'
    source_line: 57
    sql: 'CREATE OR REPLACE TEMPORARY VIEW pp AS

      SELECT name, module, pos, pn AS param_name, paramValue[pos] AS pv, paramOldValue[pos] AS pov

      FROM p LATERAL VIEW posexplode(paramName) t AS pos, pn;'
  - id: PROFILE_9_01
    kind: view
    section: '9'
    source_line: 447
    sql: 'CREATE OR REPLACE TEMPORARY VIEW range_raw USING orc

      OPTIONS (path ''<INDEX_PATH>/key=<RANGE_KEYS>'', basePath ''<INDEX_PATH>'');'
  - id: PROFILE_9_02
    kind: view
    section: '9'
    source_line: 450
    sql: "CREATE OR REPLACE TEMPORARY VIEW pr AS\nSELECT key,\n       CASE WHEN array_position(paramName, 'EPK_ID') >
      0\n            THEN paramValue[CAST(array_position(paramName, 'EPK_ID') - 1 AS INT)] END AS epk\nFROM range_raw;"
  queries:
  - id: PROFILE_1_01
    kind: query
    section: '1'
    source_line: 69
    sql: "SELECT count(*)                                AS rows_total,\n       count(DISTINCT src_file)            \
      \    AS orc_files,\n       min(createdAt)                          AS min_createdAt,\n       max(createdAt)   \
      \                       AS max_createdAt,\n       min(`__time`)                           AS min_time,\n      \
      \ max(`__time`)                           AS max_time,\n       approx_count_distinct(name)             AS distinct_names,\n\
      \       approx_count_distinct(module)           AS distinct_modules,\n       approx_count_distinct(userLogin) \
      \       AS distinct_userLogin,\n       approx_count_distinct(userName)         AS distinct_userName,\n       approx_count_distinct(session)\
      \          AS distinct_session,\n       approx_count_distinct(userNode)         AS distinct_userNode,\n       approx_count_distinct(metamodelVersion)
      AS distinct_metamodelVersion,\n       approx_count_distinct(epk)              AS distinct_epk,\n       approx_count_distinct(archiveInternalId)
      AS distinct_archiveInternalId\nFROM p;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_1_02
    kind: query
    section: '1'
    source_line: 87
    sql: "SELECT count(*)                                                     AS rows_total,\n       sum(IF(userLogin
      IS NULL, 1, 0))                             AS null_userLogin,\n       sum(IF(createdAt IS NULL, 1, 0))       \
      \                      AS null_createdAt,\n       sum(IF(session IS NULL, 1, 0))                              \
      \ AS null_session,\n       sum(IF(userNode IS NULL, 1, 0))                              AS null_userNode,\n   \
      \    sum(IF(module IS NULL, 1, 0))                                AS null_module,\n       sum(IF(name IS NULL,
      1, 0))                                  AS null_name,\n       sum(IF(userName IS NULL, 1, 0))                 \
      \             AS null_userName,\n       sum(IF(metamodelVersion IS NULL, 1, 0))                      AS null_metamodelVersion,\n\
      \       sum(IF(tags IS NULL, 1, 0))                                  AS null_tags,\n       sum(IF(size(tags) =
      0, 1, 0))                                AS empty_tags,\n       sum(IF(paramName IS NULL, 1, 0))              \
      \               AS null_paramName,\n       sum(IF(size(paramName) = 0, 1, 0))                           AS empty_paramName,\n\
      \       sum(IF(paramOldValue IS NULL, 1, 0))                         AS null_paramOldValue,\n       sum(IF(size(paramOldValue)
      = 0, 1, 0))                       AS empty_paramOldValue,\n       sum(IF(size(paramName) <> size(paramValue), 1,
      0))           AS name_value_size_mismatch,\n       sum(IF(size(paramOldValue) > 0 AND size(paramName) <> size(paramOldValue),
      1, 0)) AS name_oldvalue_size_mismatch,\n       sum(IF(epk IS NULL, 1, 0))                                   AS
      without_epk,\n       sum(IF(archiveInternalId IS NULL, 1, 0))                     AS null_archiveInternalId,\n\
      \       sum(IF(archiveInsertTime IS NULL, 1, 0))                     AS null_archiveInsertTime,\n       sum(IF(`__time`
      IS NULL, 1, 0))                              AS null_time\nFROM p;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_1_03
    kind: query
    section: '1'
    source_line: 111
    sql: "SELECT percentile_approx(row_json_len, array(0.1, 0.5, 0.9, 0.99, 0.999)) AS row_json_len_p10_50_90_99_999,\n\
      \       max(row_json_len)                                                AS row_json_len_max,\n       avg(row_json_len)\
      \                                                AS row_json_len_avg\nFROM p;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_1_04
    kind: query
    section: '1'
    source_line: 117
    sql: "SELECT count(*)                                              AS files,\n       min(cnt)                   \
      \                           AS rows_min,\n       percentile_approx(cnt, array(0.1, 0.5, 0.9))          AS rows_p10_50_90,\n\
      \       max(cnt)                                              AS rows_max,\n       avg(cnt)                   \
      \                           AS rows_avg\nFROM (SELECT src_file, count(*) AS cnt FROM p GROUP BY src_file) t;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_2_01
    kind: query
    section: '2'
    source_line: 129
    sql: 'SELECT name, count(*) AS cnt, round(100 * count(*) / sum(count(*)) OVER (), 4) AS pct

      FROM p

      GROUP BY name

      ORDER BY cnt DESC;'
    requires_views:
    - part_raw
    - p
  - id: PROFILE_2_02
    kind: query
    section: '2'
    source_line: 135
    sql: 'SELECT module, count(*) AS cnt, round(100 * count(*) / sum(count(*)) OVER (), 4) AS pct

      FROM p

      GROUP BY module

      ORDER BY cnt DESC;'
    requires_views:
    - part_raw
    - p
  - id: PROFILE_2_03
    kind: query
    section: '2'
    source_line: 141
    sql: "SELECT module, name,\n       count(*)                                            AS cnt,\n       round(100
      * count(*) / sum(count(*)) OVER (), 4)    AS pct,\n       min(size(paramName))                                AS
      params_min,\n       percentile_approx(size(paramName), 0.5)             AS params_p50,\n       max(size(paramName))\
      \                                AS params_max,\n       sum(IF(epk IS NOT NULL, 1, 0))                      AS
      with_epk,\n       sum(IF(size(paramOldValue) > 0, 1, 0))              AS with_old_values,\n       avg(row_json_len)\
      \                     AS avg_row_json_len\nFROM p\nGROUP BY module, name\nORDER BY cnt DESC;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_01
    kind: query
    section: '3'
    source_line: 159
    sql: "SELECT percentile_approx(size(paramName), array(0.1, 0.5, 0.9, 0.99, 0.999))  AS paramName_size_p10_50_90_99_999,\n\
      \       max(size(paramName))                                                  AS paramName_size_max,\n       avg(size(paramName))\
      \                                                  AS paramName_size_avg,\n       percentile_approx(size(paramOldValue),
      array(0.5, 0.9, 0.99))         AS paramOldValue_size_p50_90_99,\n       max(size(paramOldValue))              \
      \                                AS paramOldValue_size_max,\n       percentile_approx(size(tags), array(0.5, 0.9,
      0.99))                  AS tags_size_p50_90_99,\n       max(size(tags))                                       \
      \                AS tags_size_max\nFROM p;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_02
    kind: query
    section: '3'
    source_line: 169
    sql: "SELECT CASE WHEN s <= 10 THEN lpad(CAST(s AS STRING), 5, '0')\n            WHEN s <= 50 THEN '00011-00050'\n\
      \            WHEN s <= 100 THEN '00051-00100'\n            WHEN s <= 500 THEN '00101-00500'\n            WHEN s
      <= 1000 THEN '00501-01000'\n            ELSE '01001+' END AS params_count_bucket,\n       count(*) AS cnt\nFROM
      (SELECT size(paramName) AS s FROM p) t\nGROUP BY 1\nORDER BY 1;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_03
    kind: query
    section: '3'
    source_line: 181
    sql: "SELECT percentile_approx(total_len, array(0.1, 0.5, 0.9, 0.99, 0.999)) AS values_total_len_p10_50_90_99_999,\n\
      \       max(total_len)                                                 AS values_total_len_max\nFROM (SELECT aggregate(paramValue,
      0L, (acc, x) -> acc + coalesce(length(x), 0)) AS total_len FROM p) t;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_04
    kind: query
    section: '3'
    source_line: 186
    sql: "SELECT param_name,\n       count(*)                                                AS occurrences,\n      \
      \ round(100 * count(*) / (SELECT count(*) FROM p), 4)     AS pct_of_events,\n       approx_count_distinct(pv) \
      \                              AS distinct_values,\n       sum(IF(pv IS NULL, 1, 0))                          \
      \     AS null_values,\n       sum(IF(pv = '', 1, 0))                                  AS empty_values,\n      \
      \ min(length(pv))                                         AS len_min,\n       percentile_approx(length(pv), array(0.5,
      0.9, 0.99))    AS len_p50_90_99,\n       max(length(pv))                                         AS len_max,\n\
      \       avg(length(pv))                                         AS len_avg,\n       sum(IF(pov IS NOT NULL, 1,
      0))                          AS with_old_value,\n       percentile_approx(pos + 1, array(0.5, 0.9))           \
      \  AS position_p50_90,\n       sum(IF(pv RLIKE '^[0-9]+$', 1, 0))                      AS numeric_values,\n   \
      \    sum(IF(pv RLIKE '^\\\\s*[\\\\[{]', 1, 0))                   AS json_like_values\nFROM pp\nGROUP BY param_name\n\
      ORDER BY occurrences DESC;"
    requires_views:
    - part_raw
    - p
    - pp
  - id: PROFILE_3_05
    kind: query
    section: '3'
    source_line: 205
    sql: "SELECT CASE WHEN pv IS NULL          THEN '0) null'\n            WHEN length(pv) < 100    THEN '1) < 100'\n\
      \            WHEN length(pv) < 1000   THEN '2) 100 - 1K'\n            WHEN length(pv) < 10000  THEN '3) 1K - 10K'\n\
      \            WHEN length(pv) < 100000 THEN '4) 10K - 100K'\n            WHEN length(pv) < 1000000 THEN '5) 100K
      - 1M'\n            ELSE '6) >= 1M' END                   AS value_len_bucket,\n       count(*)                \
      \                    AS values_cnt,\n       sum(length(pv))                             AS chars_total,\n     \
      \  approx_count_distinct(param_name)           AS distinct_params\nFROM pp\nGROUP BY 1\nORDER BY 1;"
    requires_views:
    - part_raw
    - p
    - pp
  - id: PROFILE_3_06
    kind: query
    section: '3'
    source_line: 220
    sql: "SELECT param_name,\n       count(*)                                                        AS values_cnt,\n\
      \       sum(IF(length(pv) < 100, 1, 0))                                 AS lt_100,\n       sum(IF(length(pv) >=
      100 AND length(pv) < 1000, 1, 0))          AS `100_1K`,\n       sum(IF(length(pv) >= 1000 AND length(pv) < 10000,
      1, 0))        AS `1K_10K`,\n       sum(IF(length(pv) >= 10000 AND length(pv) < 100000, 1, 0))      AS `10K_100K`,\n\
      \       sum(IF(length(pv) >= 100000 AND length(pv) < 1000000, 1, 0))    AS `100K_1M`,\n       sum(IF(length(pv)
      >= 1000000, 1, 0))                            AS ge_1M,\n       sum(length(pv))                               \
      \                  AS chars_total,\n       max(length(pv))                                                 AS len_max\n\
      FROM pp\nGROUP BY param_name\nORDER BY chars_total DESC;"
    requires_views:
    - part_raw
    - p
    - pp
  - id: PROFILE_3_07
    kind: query
    section: '3'
    source_line: 235
    sql: "SELECT CASE WHEN total_len < 1000    THEN '1) < 1K'\n            WHEN total_len < 10000   THEN '2) 1K - 10K'\n\
      \            WHEN total_len < 100000  THEN '3) 10K - 100K'\n            WHEN total_len < 1000000 THEN '4) 100K
      - 1M'\n            ELSE '5) >= 1M' END                        AS event_values_len_bucket,\n       count(*)    \
      \                                     AS events_cnt,\n       percentile_approx(params_cnt, array(0.5, 0.9))   AS
      params_cnt_p50_90\nFROM (SELECT size(paramName) AS params_cnt,\n             aggregate(paramValue, 0L, (acc, x)
      -> acc + coalesce(length(x), 0)) AS total_len\n      FROM p) t\nGROUP BY 1\nORDER BY 1;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_08
    kind: query
    section: '3'
    source_line: 250
    sql: "SELECT param_name,\n       count(*)                                                                     AS
      values_cnt,\n       sum(IF(pv IS NULL OR pv = '', 1, 0))                                         AS null_or_empty,\n\
      \       sum(IF(pv RLIKE '^[0-9]+$', 1, 0))                                           AS digits,\n       sum(IF(pv
      NOT RLIKE '^[0-9]+$' AND lower(pv) = upper(pv) AND pv <> '', 1, 0)) AS no_letters,\n       sum(IF(lower(pv) <>
      upper(pv), 1, 0))                                        AS letters,\n       sum(IF(pv RLIKE '^\\\\s*[\\\\[{]',
      1, 0))                                     AS json_like\nFROM pp\nGROUP BY param_name\nORDER BY values_cnt DESC;"
    requires_views:
    - part_raw
    - p
    - pp
  - id: PROFILE_3_09
    kind: query
    section: '3'
    source_line: 262
    sql: "SELECT param_name, count(*) AS events_with_duplicates\nFROM (SELECT archiveInternalId, param_name, count(*)
      AS c\n      FROM (SELECT archiveInternalId, pn AS param_name FROM p LATERAL VIEW explode(paramName) t AS pn) x\n\
      \      GROUP BY archiveInternalId, param_name\n      HAVING count(*) > 1) d\nGROUP BY param_name\nORDER BY events_with_duplicates
      DESC\nLIMIT 100;"
    requires_views:
    - part_raw
    - p
  - id: PROFILE_3_10
    kind: query
    section: '3'
    source_line: 273
    sql: "SELECT module, name, param_name,\n       count(*)                                    AS occurrences,\n    \
      \   approx_count_distinct(pv)                   AS distinct_values,\n       percentile_approx(length(pv), 0.5)\
      \          AS len_p50,\n       max(length(pv))                             AS len_max\nFROM pp\nGROUP BY module,
      name, param_name\nORDER BY occurrences DESC\nLIMIT 5000;"
    requires_views:
