    source_line: 306
    sql: "SELECT count(*)                                                       AS distinct_epk,\n       min(cnt)   \
      \                                                    AS events_min,\n       percentile_approx(cnt, array(0.5, 0.75,
      0.9, 0.99, 0.999, 0.9999)) AS events_p50_75_90_99_999_9999,\n       max(cnt)                                  \
