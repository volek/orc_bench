plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'orcbench'
version = '0.1.0-SNAPSHOT'

// Cluster contract: docs/orc_hdfs_spark_hive_configs_final/environment.yaml
// java 1.8.0_292, spark 3.2.1, hive 3.1.2, hadoop 3.1.3
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
}

ext {
    sparkVersion = '3.2.1'
    hadoopVersion = '3.1.3'
    hiveVersion = '3.1.2'
    scalaBinary = '2.12'
}

configurations {
    compileOnly.extendsFrom(annotationProcessor)
}

dependencies {
    // Provided by cluster / spark-submit (SDP stack) — not bundled in fat jar
    compileOnly "org.apache.spark:spark-core_${scalaBinary}:${sparkVersion}"
    compileOnly "org.apache.spark:spark-sql_${scalaBinary}:${sparkVersion}"
    compileOnly "org.apache.spark:spark-hive_${scalaBinary}:${sparkVersion}"
    compileOnly "org.apache.hadoop:hadoop-client:${hadoopVersion}"
    compileOnly "org.apache.hive:hive-jdbc:${hiveVersion}"

    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'info.picocli:picocli:4.7.5'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.5'

    // Needed so LiveClusterBackend / SparkOrcGenerateBackend (compileOnly) resolve when tests load main
    testImplementation "org.apache.hadoop:hadoop-client:${hadoopVersion}"
    testImplementation "org.apache.hive:hive-jdbc:${hiveVersion}"
    testImplementation "org.apache.spark:spark-core_${scalaBinary}:${sparkVersion}"
    testImplementation "org.apache.spark:spark-sql_${scalaBinary}:${sparkVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'orcbench.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

shadowJar {
    archiveBaseName.set('orc-bench')
    archiveClassifier.set('all')
    mergeServiceFiles()
    zip64 true
}

tasks.named('build') {
    dependsOn shadowJar
}

// Bundle conf/ (runtime copy of configs_final) into the jar for classpath fallback
sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'conf']
        }
    }
}
